<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="50%" stop-color="#121212" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>

    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="neon-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a18cd1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fbc2eb" stop-opacity="0.8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.05" />
    </pattern>
  </defs>

  <style>
    @keyframes dash {
      0% { stroke-dashoffset: 1000; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    
    @keyframes flicker {
      0%, 100% { opacity: 1; }
      33% { opacity: 0.8; }
      66% { opacity: 0.9; }
      77% { opacity: 0.5; }
      88% { opacity: 1; }
    }

    .line {
      fill: none;
      stroke: url(#neon-cyan);
      stroke-width: 3;
      stroke-dasharray: 1000;
      stroke-dashoffset: 1000;
      animation: dash 5s linear infinite;
      filter: url(#glow);
    }
    
    .title {
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 64px;
      font-weight: 900;
      fill: #ffffff;
      letter-spacing: -2px;
      animation: float 6s ease-in-out infinite;
    }
    
    .subtitle {
      font-family: 'SF Mono', monospace;
      font-size: 16px;
      fill: #4facfe;
      letter-spacing: 4px;
      animation: float 6s ease-in-out infinite 0.2s;
    }
    
    .accent {
      fill: url(#neon-purple);
    }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Animated Glowing Lines (Cyberpunk Network) -->
  <path class="line" d="M 0 150 C 200 150, 200 50, 400 50 C 600 50, 600 250, 800 250" />
  <path class="line" d="M 0 200 C 300 200, 300 100, 500 100 C 700 100, 700 150, 800 150" style="animation-delay: 2s; stroke: url(#neon-purple)" />
  <path class="line" d="M 0 100 C 150 100, 150 250, 450 250 C 650 250, 650 50, 800 50" style="animation-delay: 1s; stroke-width: 2;" />

  <!-- Digital Nodes -->
  <circle cx="400" cy="50" r="4" fill="#00f2fe" filter="url(#glow)" style="animation: pulse 3s infinite" />
  <circle cx="500" cy="100" r="5" fill="#a18cd1" filter="url(#glow)" style="animation: pulse 4s infinite 1s" />
  <circle cx="450" cy="250" r="3" fill="#00f2fe" filter="url(#glow)" style="animation: pulse 2.5s infinite 0.5s" />

  <!-- Center Text -->
  <g transform="translate(400, 140)" style="text-anchor: middle;">
    <text class="title" y="0">
      <tspan fill="#ffffff">SPEND</tspan>
      <tspan class="accent">WISE</tspan>
    </text>
    <text class="subtitle" y="40">NEXT-GEN EXPENSE OS</text>
  </g>

  <!-- High-Tech Brackets -->
  <path d="M 220 80 L 180 80 L 180 220 L 220 220" fill="none" stroke="#333" stroke-width="4" />
  <path d="M 580 80 L 620 80 L 620 220 L 580 220" fill="none" stroke="#333" stroke-width="4" />
  
  <rect x="175" y="145" width="10" height="10" fill="#4facfe" filter="url(#glow)" style="animation: flicker 4s infinite" />
  <rect x="615" y="145" width="10" height="10" fill="#fbc2eb" filter="url(#glow)" style="animation: flicker 5s infinite 2s" />
</svg>
